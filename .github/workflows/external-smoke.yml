name: External integration smoke

on:
  schedule:
    # Weekly coverage is enough to detect upstream drift without creating daily traffic.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      yt_dlp_url:
        description: Optional public video URL for yt-dlp metadata extraction
        required: false
        type: string
      pytchat_video_id:
        description: Optional public archived livestream ID with chat replay
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: external-integration-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        stage:
          - yt-dlp
          - pytchat
          - ffmpeg
    env:
      YTDLP_SMOKE_URL: ${{ inputs.yt_dlp_url || vars.YTDLP_SMOKE_URL || 'https://www.w3schools.com/html/mov_bbb.mp4' }}
      PYTCHAT_SMOKE_VIDEO_ID: ${{ inputs.pytchat_video_id || vars.PYTCHAT_SMOKE_VIDEO_ID || '1xO3eP5HVhg' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.29'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install ffmpeg prerequisites
        if: matrix.stage == 'ffmpeg'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Run bounded external probe
        run: >-
          timeout --signal=TERM --kill-after=15s 5m
          uv run python scripts/external_smoke.py "${{ matrix.stage }}"
          --yt-dlp-url "$YTDLP_SMOKE_URL"
          --pytchat-video-id "$PYTCHAT_SMOKE_VIDEO_ID"
          --output-dir "smoke-results/${{ matrix.stage }}"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-smoke-${{ matrix.stage }}-${{ github.run_attempt }}
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 14
